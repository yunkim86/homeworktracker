<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Launchpad</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homework">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Homework%20Launchpad%22%2C%22short_name%22%3A%22Homework%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FF; --cream:#FFF8ED; --coral:#FF6F59; --coral-dark:#E8563F;
    --yellow:#FFC93C; --green:#4CAF7D; --ink:#1F2A44; --ink-soft:#5B6B8C;
    --card:#FFFFFF; --line:#E4ECF7; --warn-bg:#FFF3E9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Nunito',sans-serif;color:var(--ink);background:linear-gradient(180deg, var(--sky) 0%, var(--cream) 55%);min-height:100vh;font-size:16px;}
  .app{max-width:1100px;margin:0 auto;padding:24px 20px 70px;}
  #loading{padding:80px 20px;text-align:center;color:var(--ink-soft);font-weight:700;font-size:16px;}

  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;background:var(--card);border-radius:24px;padding:24px 28px;box-shadow:0 10px 30px rgba(31,42,68,0.08);margin-bottom:18px;}
  @media (max-width:900px){
    .hero{grid-template-columns:1fr;text-align:center;padding:26px 22px;}
  }
  .eyebrow{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.12em;font-size:12.5px;color:var(--coral-dark);margin:0 0 6px;}
  .hero h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,30px);line-height:1.2;margin:0 0 10px;}
  .hero .sub{margin:0 0 14px;color:var(--ink-soft);font-weight:600;font-size:15px;}

  .gauge-wrap{text-align:center;}
  .rocket-scene{position:relative;height:150px;margin-bottom:10px;}
  .rocket{position:absolute;bottom:14px;font-size:34px;transition:left .5s cubic-bezier(.34,1.4,.64,1);transform:translateX(-50%) rotate(-90deg);}
  .rocket.launching{animation:launch 1s ease-in forwards;}
  @keyframes launch{0%{transform:translateX(-50%) rotate(-90deg) translateY(0);opacity:1;}100%{transform:translateX(-50%) rotate(-90deg) translateY(-160px);opacity:0;}}
  .tank{position:relative;height:22px;border-radius:12px;background:var(--line);overflow:hidden;border:2px solid var(--card);box-shadow:0 0 0 2px var(--line);}
  .tank-fill{height:100%;width:0%;border-radius:12px;background:linear-gradient(90deg, var(--yellow), var(--coral));transition:width .6s ease;}
  @media (prefers-reduced-motion: reduce){.tank-fill{transition:none;} .rocket{transition:none;}}
  .bank-label{margin-top:10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;}
  .bank-label b{color:var(--coral-dark);font-size:20px;}
  .tank-note{font-size:13px;color:var(--ink-soft);margin-top:4px;font-weight:700;}
  .stats-row{display:flex;justify-content:center;gap:22px;margin-top:14px;flex-wrap:wrap;}
  .stat-box{text-align:center;}
  .stat-num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:var(--coral-dark);}
  .stat-num.balance{color:var(--green);}
  .stat-label{font-size:10.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

  .week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 18px;margin-bottom:14px;box-shadow:0 6px 16px rgba(31,42,68,0.06);flex-wrap:wrap;gap:12px;}
  .week-nav-left{display:flex;align-items:center;gap:14px;}
  .week-nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .nav-arrow{background:var(--sky);border:none;border-radius:12px;width:46px;height:46px;font-size:17px;font-weight:800;color:var(--coral-dark);cursor:pointer;}
  .nav-arrow:disabled{opacity:.35;cursor:not-allowed;}
  .week-label-wrap{line-height:1.2;}
  .week-label{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16.5px;}
  .week-sub{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .jump-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:13.5px;color:var(--coral-dark);background:var(--sky);border:none;border-radius:10px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .jump-btn:disabled{opacity:.4;cursor:not-allowed;}
  .parent-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:13.5px;color:#fff;background:var(--ink);border:none;border-radius:10px;padding:12px 16px;cursor:pointer;min-height:44px;}
  .parent-btn.on{background:var(--green);}
  .forgot-link{font-size:12px;color:var(--ink-soft);font-weight:700;text-decoration:underline;cursor:pointer;background:none;border:none;padding:6px 0;}

  .parent-banner{background:var(--warn-bg);border:2px dashed var(--coral);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;font-weight:700;color:var(--coral-dark);}

  .week{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px;}
  @media (min-width:1000px){.week{grid-template-columns:repeat(7,1fr);}}
  .day-card{background:var(--card);border-radius:18px;padding:16px 14px;box-shadow:0 6px 16px rgba(31,42,68,0.06);border:2px solid transparent;display:flex;flex-direction:column;gap:10px;}
  .day-card.today{border-color:var(--coral);}
  .day-card.off{background:#FFFBF6;}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;}
  .day-name-wrap{line-height:1.25;}
  .day-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;}
  .day-date{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
  .today-tag{font-size:10px;font-weight:800;color:#fff;background:var(--coral);border-radius:6px;padding:3px 7px;letter-spacing:.04em;height:fit-content;}
  .item{display:flex;align-items:flex-start;gap:9px;padding:10px;border-radius:12px;background:var(--sky);cursor:pointer;transition:background .15s ease;font-size:13.5px;min-height:44px;}
  .item:hover{background:#DCEEFB;}
  .item.done{background:rgba(76,175,125,0.14);}
  .item input{margin-top:2px;accent-color:var(--green);width:22px;height:22px;flex:none;cursor:pointer;}
  .item-body{display:flex;flex-direction:column;gap:2px;flex:1;}
  .item-label{font-weight:700;color:var(--ink);line-height:1.3;}
  .item.done .item-label{color:var(--green);text-decoration:line-through;text-decoration-thickness:1.5px;}
  .item-note{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .item-plus{font-size:11px;font-weight:800;color:var(--coral-dark);white-space:nowrap;}
  .item-remove{background:none;border:none;color:var(--coral-dark);font-weight:800;cursor:pointer;font-size:18px;padding:4px 6px;line-height:1;min-width:32px;min-height:32px;}
  .empty-day{font-size:13px;color:var(--ink-soft);font-weight:700;padding:10px;text-align:center;}

  .dayoff-toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--coral-dark);background:var(--warn-bg);border-radius:10px;padding:10px;cursor:pointer;min-height:40px;}
  .dayoff-toggle input{accent-color:var(--coral);width:20px;height:20px;}
  .dayoff-banner{font-size:12px;font-weight:800;color:var(--coral-dark);background:var(--warn-bg);border-radius:10px;padding:12px;text-align:center;}
  .hidden-restore{font-size:11.5px;color:var(--ink-soft);font-weight:700;cursor:pointer;text-decoration:underline;text-align:center;background:none;border:none;padding:6px;}
  .add-item-row{display:flex;gap:6px;margin-top:2px;}
  .add-item-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:'Nunito',sans-serif;min-width:0;}
  .add-item-row button{background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer;min-height:44px;}

  .redeem{background:var(--card);border-radius:20px;padding:24px 26px;box-shadow:0 6px 16px rgba(31,42,68,0.06);margin-bottom:22px;}
  .redeem h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;margin:0 0 8px;}
  .redeem.locked{color:var(--ink-soft);}
  .redeem.locked p{margin:0;font-weight:700;font-size:14px;}
  .redeem.active .stepper{display:flex;align-items:center;gap:16px;margin:14px 0;}
  .stepper button{width:50px;height:50px;border-radius:50%;border:none;background:var(--sky);color:var(--coral-dark);font-size:20px;font-weight:800;cursor:pointer;}
  .stepper button:active{background:#DCEEFB;}
  .stepper span{font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;min-width:76px;text-align:center;}
  .redeem-btn{font-family:'Fredoka',sans-serif;background:var(--coral);color:#fff;border:none;border-radius:12px;padding:14px 24px;font-weight:600;font-size:16px;cursor:pointer;min-height:48px;}
  .redeem-btn:disabled{background:#F0D9D3;cursor:not-allowed;}
  .redeem-btn:not(:disabled):hover{background:var(--coral-dark);}
  .redeem-hint{font-size:13.5px;color:var(--ink-soft);font-weight:700;margin-top:10px;}
  .redeem-msg{font-size:13.5px;font-weight:700;margin-top:8px;color:var(--coral-dark);min-height:18px;}
  .manual-log{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;}
  .manual-log-label{font-size:13px;font-weight:800;color:var(--ink-soft);margin:0 0 10px;}
  .manual-log-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .manual-log-row input[type="date"], .manual-log-row input[type="number"]{
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:'Nunito',sans-serif;min-height:44px;
  }
  .manual-log-row input[type="number"]{width:84px;}
  .manual-log-row button{font-family:'Nunito',sans-serif;font-weight:800;font-size:13.5px;color:#fff;background:var(--ink);border:none;border-radius:10px;padding:10px 18px;cursor:pointer;min-height:44px;}
  .manual-log-msg{font-size:12.5px;font-weight:700;color:var(--coral-dark);margin-top:6px;min-height:16px;}

  .redeemlog{background:var(--card);border-radius:20px;padding:22px 24px;box-shadow:0 6px 16px rgba(31,42,68,0.06);margin-bottom:22px;overflow-x:auto;}
  .redeemlog h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;margin:0 0 4px;}
  .redeemlog-sub{font-size:13px;color:var(--ink-soft);font-weight:700;margin:0 0 14px;}
  .redeemlog-sub b{color:var(--coral-dark);}
  .redeemlog table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:340px;}
  .redeemlog th{text-align:left;font-size:11px;letter-spacing:.05em;color:var(--ink-soft);font-weight:800;padding:0 8px 8px;border-bottom:2px solid var(--line);}
  .redeemlog td{padding:12px 8px;border-bottom:1px solid var(--line);font-weight:700;}
  .redeemlog td.mins{color:var(--coral-dark);text-align:right;white-space:nowrap;}
  .redeemlog-empty{font-size:13.5px;color:var(--ink-soft);font-weight:700;padding:6px 4px;}
  .redeemlog td.actions{white-space:nowrap;text-align:right;}
  .redeemlog .row-btn{background:none;border:none;cursor:pointer;font-size:17px;padding:8px 10px;line-height:1;min-width:40px;min-height:40px;}
  .redeemlog .row-btn.edit{color:var(--ink-soft);}
  .redeemlog .row-btn.del{color:var(--coral-dark);}

  .pianolog{background:var(--card);border-radius:20px;padding:22px 24px;box-shadow:0 6px 16px rgba(31,42,68,0.06);margin-bottom:22px;overflow-x:auto;}
  .pianolog h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;margin:0 0 4px;}
  .pianolog-sub{font-size:13px;color:var(--ink-soft);font-weight:700;margin:0 0 14px;}
  .pianolog-sub b{color:var(--coral-dark);}
  .pianolog table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:380px;}
  .pianolog th{text-align:left;font-size:11px;letter-spacing:.05em;color:var(--ink-soft);font-weight:800;padding:0 8px 8px;border-bottom:2px solid var(--line);}
  .pianolog td{padding:12px 8px;border-bottom:1px solid var(--line);font-weight:700;vertical-align:middle;}
  .pianolog td.count{white-space:nowrap;}
  .pianolog td.mins{color:var(--coral-dark);white-space:nowrap;}
  .piano-bar-track{background:var(--line);border-radius:6px;height:12px;overflow:hidden;min-width:80px;}
  .piano-bar-fill{background:var(--green);height:100%;border-radius:6px;}
  .pianolog-empty{font-size:13.5px;color:var(--ink-soft);font-weight:700;padding:6px 4px;}

  .history h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;margin:0 0 12px 4px;}
  .history ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .history li{background:var(--card);border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:700;color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px;box-shadow:0 3px 8px rgba(31,42,68,0.04);}
  .history li .amt{color:var(--green);white-space:nowrap;}
  .history li .amt.neg{color:var(--coral-dark);}
  .history-empty{font-size:13.5px;color:var(--ink-soft);font-weight:700;padding:6px 4px;}

  /* Landscape tablets are wide but short — trim vertical space so more content
     fits without scrolling, while keeping touch targets full-size. */
  @media (orientation:landscape) and (max-height:900px){
    .app{padding-top:16px;padding-bottom:40px;}
    .hero{padding:16px 24px;gap:18px;margin-bottom:14px;}
    .eyebrow{margin-bottom:4px;}
    .hero h1{font-size:19px;line-height:1.15;margin-bottom:6px;}
    .hero .sub{margin-bottom:0;font-size:13px;}
    .rocket-scene{height:80px;margin-bottom:6px;}
    .rocket{font-size:26px;bottom:8px;}
    .tank{height:16px;}
    .stats-row{margin-top:8px;gap:16px;}
    .stat-num{font-size:18px;}
    .stat-label{font-size:9.5px;}
    .tank-note{font-size:11px;margin-top:2px;}
    .week-nav{padding:8px 14px;margin-bottom:10px;}
    .nav-arrow{width:40px;height:40px;}
    .jump-btn, .parent-btn{padding:9px 14px;min-height:38px;}
    .week{gap:10px;margin-bottom:14px;}
    .day-card{padding:10px 10px;gap:6px;border-radius:14px;}
    .day-name{font-size:14px;}
    .day-date{font-size:10.5px;}
    .item{padding:7px 8px;min-height:38px;gap:7px;}
    .item input{width:19px;height:19px;}
    .item-note{font-size:10px;}
    .redeem, .redeemlog, .pianolog{padding:16px 20px;margin-bottom:14px;}
    .history h2{margin-bottom:8px;}
    .history li{padding:9px 14px;}
  }
  /* Even shorter landscape (phones sideways, small tablets) — trim further */
  @media (orientation:landscape) and (max-height:520px){
    .rocket-scene{height:0;margin-bottom:0;}
    .rocket{display:none;}
    .hero{grid-template-columns:1.3fr 1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="loading">Loading the launchpad…</div>
  <div id="content" style="display:none;">

    <div class="hero">
      <div>
        <p class="eyebrow">HOMEWORK LAUNCHPAD · 2026–2027</p>
        <h1>Finish homework. Fuel the rocket. Launch screen time on the weekend.</h1>
        <p class="sub">Every checked-off item adds 10 minutes to the tank. Redeem any day.</p>
      </div>
      <div class="gauge-wrap">
        <div class="rocket-scene"><div class="rocket" id="rocketIcon">🚀</div></div>
        <div class="tank"><div class="tank-fill" id="tankFill"></div></div>
        <div class="stats-row">
          <div class="stat-box"><div class="stat-num" id="statBanked">0</div><div class="stat-label">Banked</div></div>
          <div class="stat-box"><div class="stat-num" id="statRedeemed">0</div><div class="stat-label">Redeemed</div></div>
          <div class="stat-box"><div class="stat-num balance" id="statBalance">0</div><div class="stat-label">Balance</div></div>
        </div>
        <div class="tank-note" id="tankNote"></div>
      </div>
    </div>

    <div class="week-nav">
      <div class="week-nav-left">
        <button class="nav-arrow" id="prevWeekBtn" type="button">◀</button>
        <div class="week-label-wrap">
          <div class="week-label" id="weekLabel"></div>
          <div class="week-sub" id="weekSub"></div>
        </div>
        <button class="nav-arrow" id="nextWeekBtn" type="button">▶</button>
      </div>
      <div class="week-nav-right">
        <button class="jump-btn" id="jumpBtn" type="button">Jump to this week</button>
        <button class="jump-btn" id="backupBtn" type="button">💾 Backup</button>
        <button class="parent-btn" id="parentBtn" type="button">👪 Parent Mode</button>
      </div>
    </div>

    <input type="file" id="restoreFileInput" accept="application/json" style="display:none;" />

    <div id="parentBanner"></div>

    <div class="week" id="weekGrid"></div>

    <div class="redeem" id="redeemPanel"></div>

    <div class="redeemlog" id="redeemLog"></div>

    <div class="pianolog" id="pianoLog"></div>

    <div class="history">
      <h2>Recent activity</h2>
      <ul id="historyList"></ul>
    </div>

  </div>
</div>

<script>
const ANCHOR = '2026-08-17'; // first day of school, Monday

const DAYS = [
  {key:'Mon', name:'Monday'}, {key:'Tue', name:'Tuesday'}, {key:'Wed', name:'Wednesday'},
  {key:'Thu', name:'Thursday'}, {key:'Fri', name:'Friday'}, {key:'Sat', name:'Saturday'}, {key:'Sun', name:'Sunday'},
];

const FIXED_ITEMS = {
  Mon: [
    {id:'g', emoji:'📖', label:'Grammar worksheet', note:'Turn in tomorrow'},
    {id:'piano_mon', emoji:'🎹', label:'Piano practice', note:'Warm-up ahead of Wednesday\u2019s class'},
    {id:'koreandiary', emoji:'📔', label:'Korean diary', note:'Due Saturday'},
  ],
  Tue: [
    {id:'g', emoji:'📖', label:'Grammar worksheet', note:'Turn in tomorrow'},
    {id:'m', emoji:'➗', label:'Math worksheet', note:'Turn in tomorrow'},
  ],
  Wed: [
    {id:'g', emoji:'📖', label:'Grammar worksheet', note:'Turn in tomorrow'},
    {id:'m', emoji:'➗', label:'Math worksheet', note:'Turn in tomorrow'},
    {id:'piano_wed', emoji:'🎹', label:'Piano practice', note:'Right after class — reinforce today\u2019s lesson'},
  ],
  Thu: [
    {id:'g', emoji:'📖', label:'Grammar worksheet', note:'Turn in tomorrow'},
    {id:'m', emoji:'➗', label:'Math worksheet', note:'Turn in tomorrow'},
    {id:'bookreview', emoji:'📗', label:'Book review', note:'Due Saturday'},
  ],
  Fri: [
    {id:'piano_fri', emoji:'🎹', label:'Piano practice', note:'Light review — keeps it fresh over the weekend'},
  ],
  Sat: [{id:'korean', emoji:'🇰🇷', label:'Korean school homework', note:'After Korean class'}],
  Sun: [{id:'aops', emoji:'🧮', label:'AOPS math homework', note:'After AOPS class'}],
};

const FLEX_ITEMS = [
  {id:'extra', emoji:'⭐', label:'Extra homework from Mom', note:'If there\u2019s time'},
];

const MINUTES_PER_ITEM = 10;
const TANK_SCALE = 180;

// Known one-off items for specific weeks (tests, exams, etc.) — auto-applied
// the first time that week is opened. Keyed by that week's Monday date.
const WEEK_SEED = {
  '2026-08-17': { // Week 1
    Fri: [{emoji:'🧠', label:'Test Prep: Spelling test #1', note:'Study ahead — test is next Friday'}],
  },
  '2026-08-24': { // Week 2
    Wed: [{emoji:'🧠', label:'Test Prep: Literature test #1', note:'Study tonight for tomorrow\u2019s test'}],
    Thu: [{emoji:'📚', label:'Literature test #1', note:'Test day'}],
    Fri: [{emoji:'🔤', label:'Spelling test #1', note:'Test day'}],
  },
};

let bankState = null;      // {history, parentPin, redemptions}
let viewWeekStart = null;  // 'YYYY-MM-DD' Monday of the week being viewed
let weekData = null;       // {checklist, customItems, hiddenItems, dayOff} for viewWeekStart
let parentMode = false;

function pad(n){return n<10 ? '0'+n : ''+n;}

function getWeekStartStr(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const day = date.getDay();
  const diff = (day === 0) ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate());
}
function addDaysStr(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function clampToAnchor(ws){ return ws < ANCHOR ? ANCHOR : ws; }
function weekNumber(weekStart){
  const a = new Date(ANCHOR+'T00:00:00');
  const w = new Date(weekStart+'T00:00:00');
  const diffDays = Math.round((w-a)/86400000);
  return Math.floor(diffDays/7)+1;
}
function formatWeekLabel(weekStart){
  const start = new Date(weekStart+'T00:00:00');
  const end = new Date(start); end.setDate(end.getDate()+6);
  const startStr = start.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  const endStr = end.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  return startStr + ' – ' + endStr;
}
function shortDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function todayDateStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function weekdayAbbrev(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'short'});
}
function formatDateFull(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
function realTodayWeekStart(){ return getWeekStartStr(new Date()); }
function todayDayKeyIfInWeek(weekStart){
  if(weekStart !== realTodayWeekStart()) return null;
  const jsDay = new Date().getDay();
  return DAYS[(jsDay + 6) % 7].key;
}
function defaultBankState(){ return {history:[], parentPin:null, redemptions:[]}; }
function defaultWeekData(){ return {checklist:{}, customItems:{}, hiddenItems:{}, dayOff:{}}; }

function buildSeedWeekData(weekStart){
  const wd = defaultWeekData();
  const seed = WEEK_SEED[weekStart];
  if(seed){
    Object.keys(seed).forEach(dayKey=>{
      wd.customItems[dayKey] = seed[dayKey].map((it, idx) => ({
        id: 'seed_'+weekStart+'_'+dayKey+'_'+idx,
        emoji: it.emoji, label: it.label, note: it.note,
      }));
    });
  }
  return wd;
}

const STORAGE_PREFIX = 'hwlaunchpad:';

async function storageGet(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw === null ? null : {key, value: raw};
  }catch(e){ console.error('localStorage get failed', e); return null; }
}
async function storageSet(key, value){
  try{ localStorage.setItem(STORAGE_PREFIX + key, value); return {key, value}; }
  catch(e){ console.error('localStorage set failed', e); return null; }
}
async function storageList(prefix){
  try{
    const keys = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(STORAGE_PREFIX + prefix) === 0){
        keys.push(k.slice(STORAGE_PREFIX.length));
      }
    }
    return {keys};
  }catch(e){ console.error('localStorage list failed', e); return {keys: []}; }
}

async function loadBankState(){
  try{
    const res = await storageGet('bank-data');
    if(res && res.value){
      const p = JSON.parse(res.value);
      if(!p.history) p.history = [];
      if(typeof p.parentPin === 'undefined') p.parentPin = null;
      if(!Array.isArray(p.redemptions)) p.redemptions = [];
      p.redemptions.forEach(r => { if(!r.id) r.id = 'r'+Date.now()+Math.floor(Math.random()*100000); });
      return p;
    }
  }catch(e){ console.error('load bank failed', e); }
  return defaultBankState();
}
async function saveBankState(){
  try{ await storageSet('bank-data', JSON.stringify(bankState)); }
  catch(e){ console.error('save bank failed', e); }
}
async function loadWeekData(weekStart){
  try{
    const res = await storageGet('week:'+weekStart);
    if(res && res.value){
      const p = JSON.parse(res.value);
      return {
        checklist: p.checklist || {},
        customItems: p.customItems || {},
        hiddenItems: p.hiddenItems || {},
        dayOff: p.dayOff || {},
      };
    }
  }catch(e){ /* no data for this week yet */ }
  return buildSeedWeekData(weekStart);
}
async function saveWeekData(){
  try{ await storageSet('week:'+viewWeekStart, JSON.stringify(weekData)); }
  catch(e){ console.error('save week failed', e); }
}

function addHistory(text, delta){
  const now = new Date();
  bankState.history.unshift({text, delta, ts: now.getHours()+':'+pad(now.getMinutes())+' · '+(now.getMonth()+1)+'/'+now.getDate()});
  bankState.history = bankState.history.slice(0, 10);
}

function baseItemsFor(dayKey){
  return (FIXED_ITEMS[dayKey] || []).concat(FLEX_ITEMS);
}
function allItemsFor(dayKey){
  let items = [];
  if(!weekData.dayOff[dayKey]){
    const hidden = weekData.hiddenItems[dayKey] || [];
    items = baseItemsFor(dayKey).filter(it => !hidden.includes(it.id));
  }
  const custom = (weekData.customItems[dayKey] || []).map(it => Object.assign({custom:true}, it));
  return items.concat(custom);
}

async function toggleItem(dayKey, itemId, label){
  if(!weekData.checklist[dayKey]) weekData.checklist[dayKey] = {};
  const wasDone = !!weekData.checklist[dayKey][itemId];
  weekData.checklist[dayKey][itemId] = !wasDone;
  const wk = weekNumber(viewWeekStart);
  if(!wasDone){
    addHistory('✅ '+label+' ('+dayKey+' · Wk '+wk+')', MINUTES_PER_ITEM);
  }else{
    addHistory('↩️ Unchecked '+label+' ('+dayKey+' · Wk '+wk+')', -MINUTES_PER_ITEM);
  }
  await saveWeekData(); await saveBankState(); render();
}

async function hideItem(dayKey, itemId, label){
  if(!weekData.hiddenItems[dayKey]) weekData.hiddenItems[dayKey] = [];
  if(!weekData.hiddenItems[dayKey].includes(itemId)) weekData.hiddenItems[dayKey].push(itemId);
  if(weekData.checklist[dayKey] && weekData.checklist[dayKey][itemId]){
    delete weekData.checklist[dayKey][itemId];
    addHistory('🚫 Removed '+label+' ('+dayKey+' · Wk '+weekNumber(viewWeekStart)+')', -MINUTES_PER_ITEM);
  }
  await saveWeekData(); await saveBankState(); render();
}

async function restoreHidden(dayKey){
  weekData.hiddenItems[dayKey] = [];
  await saveWeekData(); render();
}

const ICON_KEYWORDS = [
  ['test prep', '🧠'],
  ['grammar', '📖'],
  ['math', '➗'],
  ['book', '📗'],
  ['test', '📚'],
  ['piano', '🎹'],
  ['korean', '🇰🇷'],
  ['spelling', '🔤'],
  ['diary', '📔'],
];
function pickEmojiForLabel(label){
  const lower = (label || '').toLowerCase();
  for(const [kw, emoji] of ICON_KEYWORDS){
    if(lower.indexOf(kw) !== -1) return emoji;
  }
  return '📝';
}

async function addCustomItem(dayKey, label){
  const clean = (label || '').trim();
  if(!clean) return;
  if(!weekData.customItems[dayKey]) weekData.customItems[dayKey] = [];
  const id = 'c'+Date.now()+Math.floor(Math.random()*1000);
  weekData.customItems[dayKey].push({id, emoji: pickEmojiForLabel(clean), label:clean, note:'Added by parent'});
  await saveWeekData(); render();
}

async function removeCustomItem(dayKey, itemId, label){
  weekData.customItems[dayKey] = (weekData.customItems[dayKey] || []).filter(i => i.id !== itemId);
  if(weekData.checklist[dayKey] && weekData.checklist[dayKey][itemId]){
    delete weekData.checklist[dayKey][itemId];
    addHistory('🚫 Removed '+label+' ('+dayKey+' · Wk '+weekNumber(viewWeekStart)+')', -MINUTES_PER_ITEM);
  }
  await saveWeekData(); await saveBankState(); render();
}

async function toggleDayOff(dayKey){
  const turningOn = !weekData.dayOff[dayKey];
  weekData.dayOff[dayKey] = turningOn;
  if(turningOn){
    const items = baseItemsFor(dayKey);
    items.forEach(it=>{
      if(weekData.checklist[dayKey] && weekData.checklist[dayKey][it.id]){
        delete weekData.checklist[dayKey][it.id];
      }
    });
    addHistory('🧳 '+dayKey+' marked no-school (Wk '+weekNumber(viewWeekStart)+')', 0);
  }
  await saveWeekData(); await saveBankState(); render();
}

async function manualRedeem(dateStr, minutesRaw){
  const msgEl = document.getElementById('manualLogMsg');
  const minutes = parseInt(minutesRaw, 10);
  if(!dateStr){ if(msgEl) msgEl.textContent = 'Pick a date.'; return; }
  if(!minutes || minutes <= 0){ if(msgEl) msgEl.textContent = 'Enter minutes greater than 0.'; return; }
  bankState.redemptions.unshift({id: 'r'+Date.now()+Math.floor(Math.random()*100000), date: dateStr, weekday: weekdayAbbrev(dateStr), minutes, time:'logged'});
  addHistory('📝 Logged '+minutes+' min screen time ('+formatDateFull(dateStr)+')', -minutes);
  await saveBankState();
  render();
}

let pianoStatsCache = {}; // weekStart -> {total, done}

function computePianoStatsForWeek(wd){
  let total = 0, done = 0;
  DAYS.forEach(d=>{
    const dayOff = wd.dayOff && wd.dayOff[d.key];
    if(!dayOff){
      const hidden = (wd.hiddenItems && wd.hiddenItems[d.key]) || [];
      (FIXED_ITEMS[d.key] || []).filter(it => it.id.indexOf('piano') === 0 && !hidden.includes(it.id)).forEach(it=>{
        total++;
        if(wd.checklist[d.key] && wd.checklist[d.key][it.id]) done++;
      });
    }
    ((wd.customItems && wd.customItems[d.key]) || []).filter(it => (it.label || '').toLowerCase().includes('piano')).forEach(it=>{
      total++;
      if(wd.checklist[d.key] && wd.checklist[d.key][it.id]) done++;
    });
  });
  return {total, done};
}

async function loadAllWeeksPianoStats(){
  const stats = {};
  try{
    const listRes = await storageList('week:');
    const keys = (listRes && listRes.keys) || [];
    for(const k of keys){
      const weekStart = k.slice('week:'.length);
      try{
        const res = await storageGet(k);
        if(res && res.value){
          const wd = JSON.parse(res.value);
          stats[weekStart] = computePianoStatsForWeek({
            checklist: wd.checklist || {}, customItems: wd.customItems || {},
            hiddenItems: wd.hiddenItems || {}, dayOff: wd.dayOff || {},
          });
        }
      }catch(e){ /* skip unreadable week */ }
    }
  }catch(e){ console.error('list weeks failed', e); }
  return stats;
}

let redeemAmount = 10;

async function redeem(){
  addHistory('🚀 Redeemed '+redeemAmount+' min screen time', -redeemAmount);
  const now = new Date();
  const dStr = todayDateStr();
  bankState.redemptions.unshift({
    id: 'r'+Date.now()+Math.floor(Math.random()*100000),
    date: dStr,
    weekday: weekdayAbbrev(dStr),
    minutes: redeemAmount,
    time: now.getHours()+':'+pad(now.getMinutes()),
  });
  await saveBankState();
  const rocket = document.getElementById('rocketIcon');
  if(rocket){ rocket.classList.add('launching'); setTimeout(()=>rocket.classList.remove('launching'), 1000); }
  redeemAmount = 10; render();
}

async function goToWeek(newStart){
  viewWeekStart = clampToAnchor(newStart);
  weekData = await loadWeekData(viewWeekStart);
  render();
}

function backupData(){
  const data = {};
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(STORAGE_PREFIX) === 0){
      data[k.slice(STORAGE_PREFIX.length)] = localStorage.getItem(k);
    }
  }
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'homework-launchpad-backup-'+todayDateStr()+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

async function handleRestoreFile(file){
  if(!file) return;
  if(!confirm('This replaces ALL current data (homework log, redemptions, history) with the backup file. This can\u2019t be undone. Continue?')) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    Object.keys(data).forEach(k => localStorage.setItem(STORAGE_PREFIX + k, data[k]));
    alert('Backup restored. The app will reload now.');
    location.reload();
  }catch(e){
    alert('Couldn\u2019t read that file — make sure it\u2019s a backup exported from this app.');
  }
}

function toggleParentMode(){
  if(parentMode){ parentMode = false; render(); return; }
  if(!bankState.parentPin){
    const pin = window.prompt('Create a parent PIN (4+ characters) to protect these settings:');
    if(pin === null) return;
    if(pin.trim().length < 4){ alert('PIN needs to be at least 4 characters.'); return; }
    bankState.parentPin = pin.trim();
    saveBankState();
    parentMode = true; render();
    return;
  }
  const entered = window.prompt('Enter parent PIN:');
  if(entered === null) return;
  if(entered.trim() === bankState.parentPin){ parentMode = true; render(); }
  else{ alert('Incorrect PIN.'); }
}

function forgotPin(){
  if(confirm('Reset the parent PIN? You\u2019ll set a new one next time you open Parent Mode.')){
    bankState.parentPin = null; saveBankState(); alert('PIN reset.');
  }
}

function bankedMinutesForWeek(wd){
  let count = 0;
  DAYS.forEach(d=>{
    const dayChecklist = (wd.checklist && wd.checklist[d.key]) || {};
    count += Object.values(dayChecklist).filter(Boolean).length;
  });
  return count * MINUTES_PER_ITEM;
}
function redeemedMinutesForWeek(weekStart){
  const weekEnd = addDaysStr(weekStart, 6);
  return bankState.redemptions
    .filter(r => r.date >= weekStart && r.date <= weekEnd)
    .reduce((s,r)=>s+r.minutes, 0);
}

async function editRedemption(id){
  const r = bankState.redemptions.find(x => x.id === id);
  if(!r) return;
  const entered = window.prompt('Edit minutes for '+formatDateFull(r.date)+' (was '+r.minutes+'):', r.minutes);
  if(entered === null) return;
  const newVal = parseInt(entered, 10);
  if(!newVal || newVal <= 0){ alert('Enter a whole number greater than 0.'); return; }
  const oldVal = r.minutes;
  r.minutes = newVal;
  addHistory('✏️ Edited redemption on '+formatDateFull(r.date)+': '+oldVal+' → '+newVal+' min', newVal - oldVal);
  await saveBankState();
  render();
}

async function deleteRedemption(id){
  const r = bankState.redemptions.find(x => x.id === id);
  if(!r) return;
  if(!confirm('Delete the '+r.minutes+' min redemption logged for '+formatDateFull(r.date)+'?')) return;
  bankState.redemptions = bankState.redemptions.filter(x => x.id !== id);
  addHistory('🗑️ Deleted redemption on '+formatDateFull(r.date)+' ('+r.minutes+' min)', r.minutes);
  await saveBankState();
  render();
}

  const redeemedThisView = redeemedMinutesForWeek(viewWeekStart);

  document.getElementById('statBanked').textContent = bankedThisView;
  document.getElementById('statRedeemed').textContent = redeemedThisView;
  document.getElementById('statBalance').textContent = balanceThisView;

    balanceThisView >= TANK_SCALE ? 'Tank full! Great work.' :
    balanceThisView < 0 ? 'Borrowed time — next homework pays it back.' : '';

  document.getElementById('weekSub').textContent = viewWeekStart === realTodayWeekStart() ? 'This is the current week' : 'School year 2026–2027';
  document.getElementById('prevWeekBtn').disabled = (viewWeekStart <= ANCHOR);
  document.getElementById('jumpBtn').disabled = (viewWeekStart === clampToAnchor(realTodayWeekStart()));

  const parentBtn = document.getElementById('parentBtn');
  parentBtn.textContent = parentMode ? '✅ Parent Mode ON' : '👪 Parent Mode';
  parentBtn.className = 'parent-btn' + (parentMode ? ' on' : '');

  const banner = document.getElementById('parentBanner');
  if(parentMode){
    banner.innerHTML = '<div class="parent-banner">Parent Mode is on. For <b>Week '+weekNumber(viewWeekStart)+'</b>: mark travel/no-school days, remove items that don\u2019t apply, or add a specific test or trip task. The screen-time redemption log below also becomes editable. '+
      '<button class="forgot-link" id="forgotPinBtn" type="button" style="margin-left:8px;">Forgot PIN?</button>'+
      '<button class="forgot-link" id="restoreBtn" type="button" style="margin-left:12px;">Restore from backup file…</button></div>';
    document.getElementById('forgotPinBtn').addEventListener('click', forgotPin);
    document.getElementById('restoreBtn').addEventListener('click', ()=> document.getElementById('restoreFileInput').click());
  }else{
    banner.innerHTML = '';
  }

  const todK = todayDayKeyIfInWeek(viewWeekStart);
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  DAYS.forEach((d, i)=>{
    const dateStr = addDaysStr(viewWeekStart, i);
    const isOff = !!weekData.dayOff[d.key];
    const items = allItemsFor(d.key);
    const hiddenCount = (weekData.hiddenItems[d.key] || []).length;

    const card = document.createElement('div');
    card.className = 'day-card' + (d.key === todK ? ' today' : '') + (isOff ? ' off' : '');

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML =
      '<span class="day-name-wrap"><span class="day-name">'+d.name+'</span><br/><span class="day-date">'+shortDate(dateStr)+'</span></span>' +
      (d.key===todK ? '<span class="today-tag">TODAY</span>' : '');
    card.appendChild(head);

    if(parentMode){
      const toggleRow = document.createElement('label');
      toggleRow.className = 'dayoff-toggle';
      toggleRow.innerHTML = '<input type="checkbox" '+(isOff?'checked':'')+' /> 🧳 Day off (travel/break)';
      toggleRow.querySelector('input').addEventListener('change', ()=>toggleDayOff(d.key));
      card.appendChild(toggleRow);
    }

    if(isOff){
      const banner2 = document.createElement('div');
      banner2.className = 'dayoff-banner';
      banner2.textContent = '🧳 No school — travel/break';
      card.appendChild(banner2);
    }else if(items.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-day';
      empty.textContent = 'No new worksheets — free evening 🎉';
      card.appendChild(empty);
    }

    items.forEach(item=>{
      const done = !!(weekData.checklist[d.key] && weekData.checklist[d.key][item.id]);
      const row = document.createElement('label');
      row.className = 'item' + (done ? ' done' : '');
      row.innerHTML =
        '<input type="checkbox" '+(done?'checked':'')+' />'+
        '<span class="item-body">'+
          '<span class="item-label">'+item.emoji+' '+item.label+'</span>'+
          '<span class="item-note">'+item.note+'</span>'+
        '</span>'+
        '<span class="item-plus">+10</span>' +
        (parentMode ? '<button type="button" class="item-remove" title="Remove for this week">✕</button>' : '');
      row.querySelector('input').addEventListener('change', ()=>toggleItem(d.key, item.id, item.label));
      if(parentMode){
        row.querySelector('.item-remove').addEventListener('click', (e)=>{
          e.preventDefault(); e.stopPropagation();
          if(item.custom) removeCustomItem(d.key, item.id, item.label);
          else hideItem(d.key, item.id, item.label);
        });
      }
      card.appendChild(row);
    });

    if(parentMode){
      if(!isOff && hiddenCount > 0){
        const restore = document.createElement('button');
        restore.type = 'button';
        restore.className = 'hidden-restore';
        restore.textContent = hiddenCount + ' item'+(hiddenCount===1?'':'s')+' hidden · restore';

      const submit = ()=>{ addCustomItem(d.key, input.value); input.value=''; };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });

  const panel = document.getElementById('redeemPanel');
  {
    redeemAmount = Math.max(10, redeemAmount);
    panel.className = 'redeem active';

        '<button id="incBtn" type="button">+10</button>'+
      '</div>'+

      '<div class="redeem-msg" id="redeemMsg"></div>'+
      '<div class="manual-log">'+
        '<p class="manual-log-label">Or log a redemption for any date</p>'+
        '<div class="manual-log-row">'+
          '<input type="date" id="manualDate" value="'+todayDateStr()+'" />'+
          '<input type="number" id="manualMinutes" value="10" step="10" min="10" />'+
          '<span style="font-size:12.5px;font-weight:700;color:var(--ink-soft);">min</span>'+
          '<button type="button" id="manualLogBtn">Log it</button>'+
        '</div>'+
        '<div class="manual-log-msg" id="manualLogMsg"></div>'+
      '</div>';
    document.getElementById('decBtn').addEventListener('click', ()=>{

  const redeemedWeeksSet = new Set(bankState.redemptions.map(r => getWeekStartStr(new Date(r.date+'T00:00:00'))));
  const avgPerWeekRedeemed = redeemedWeeksSet.size ? Math.round(allTimeTotal / redeemedWeeksSet.size) : 0;
  const thisRealWeek = realTodayWeekStart();
  const weekTotal = bankState.redemptions
    .filter(r => getWeekStartStr(new Date(r.date+'T00:00:00')) === thisRealWeek)
    .reduce((s,r)=>s+r.minutes, 0);

  // group by date for a clean per-day view

  bankState.redemptions.forEach(r=>{
    if(!byDate[r.date]) byDate[r.date] = {weekday:r.weekday, total:0, events:[]};
    byDate[r.date].total += r.minutes;
    byDate[r.date].events.push(r);
  });
  const dateKeys = Object.keys(byDate).sort((a,b)=> a < b ? 1 : -1);

  let logHtml = '<h2>📅 Screen time redeemed</h2>' +
    '<p class="redeemlog-sub">This week: <b>'+weekTotal+' min</b> &nbsp;·&nbsp; Average per week: <b>'+avgPerWeekRedeemed+' min</b></p>';

  if(dateKeys.length === 0){
    logHtml += '<div class="redeemlog-empty">No screen time redeemed yet.</div>';
  }else if(parentMode){
    logHtml += '<table><thead><tr><th>Date</th><th>Amount</th><th></th></tr></thead><tbody>';
    dateKeys.forEach(dk=>{
      byDate[dk].events.forEach(e=>{
        logHtml += '<tr>'+
          '<td>'+formatDateFull(dk)+'</td>'+
          '<td class="mins">'+e.minutes+' min'+(e.time==='logged' ? ' (logged)' : ' @ '+e.time)+'</td>'+
          '<td class="actions">'+
            '<button type="button" class="row-btn edit" data-edit-id="'+e.id+'" title="Edit minutes">✎</button>'+
            '<button type="button" class="row-btn del" data-del-id="'+e.id+'" title="Delete">✕</button>'+
          '</td></tr>';
      });
    });
    logHtml += '</tbody></table>';
  }else{
    logHtml += '<table><thead><tr><th>Date</th><th>Times redeemed</th><th style="text-align:right;">Total min</th></tr></thead><tbody>';
    dateKeys.forEach(dk=>{
      const day = byDate[dk];
      const times = day.events.map(e => e.minutes+'m'+(e.time==='logged' ? ' (logged)' : ' @ '+e.time)).join(', ');
      logHtml += '<tr><td>'+formatDateFull(dk)+'</td><td>'+times+'</td><td class="mins">'+day.total+'</td></tr>';
    });
    logHtml += '</tbody></table>';
  }
  logEl.innerHTML = logHtml;
  if(parentMode && dateKeys.length > 0){
    logEl.querySelectorAll('[data-edit-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> editRedemption(btn.getAttribute('data-edit-id')));
    });
    logEl.querySelectorAll('[data-del-id]').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteRedemption(btn.getAttribute('data-del-id')));
    });
  }

  const pianoEl = document.getElementById('pianoLog');
  pianoStatsCache[viewWeekStart] = computePianoStatsForWeek(weekData); // keep current week accurate live
  const pianoWeeks = Object.keys(pianoStatsCache)
    .filter(ws => pianoStatsCache[ws].total > 0)
    .sort((a,b)=> a < b ? 1 : -1);

  const totalDoneAll = pianoWeeks.reduce((s,ws)=> s + pianoStatsCache[ws].done, 0);
  const avgPerWeek = pianoWeeks.length ? (totalDoneAll / pianoWeeks.length).toFixed(1) : '0';

  let pianoHtml = '<h2>🎹 Piano practice by week</h2>' +
    '<p class="pianolog-sub">Average: <b>'+avgPerWeek+' sessions/week</b> &nbsp;·&nbsp; Total logged: <b>'+totalDoneAll+' sessions</b></p>';

  if(pianoWeeks.length === 0){
    pianoHtml += '<div class="pianolog-empty">No piano weeks tracked yet.</div>';
  }else{
    pianoHtml += '<table><thead><tr><th>Week</th><th>Sessions</th><th>Practice time</th><th>Compared</th></tr></thead><tbody>';
    pianoWeeks.forEach(ws=>{
      const s = pianoStatsCache[ws];
      const pct = s.total > 0 ? Math.round((s.done / s.total) * 100) : 0;
      const isCurrent = ws === viewWeekStart;
      pianoHtml += '<tr'+(isCurrent ? ' style="background:'+"'"+'rgba(255,111,89,0.06)'+"'"+';"' : '')+'>'+
        '<td>Wk '+weekNumber(ws)+' · '+formatWeekLabel(ws)+(isCurrent ? ' <span style="color:var(--coral-dark);">(viewing)</span>' : '')+'</td>'+
        '<td class="count">'+s.done+' / '+s.total+'</td>'+
        '<td class="mins">'+(s.done * MINUTES_PER_ITEM)+' min</td>'+
        '<td><div class="piano-bar-track"><div class="piano-bar-fill" style="width:'+pct+'%"></div></div></td>'+
        '</tr>';
    });
    pianoHtml += '</tbody></table>';
  }
  pianoEl.innerHTML = pianoHtml;

  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if(bankState.history.length === 0){
    list.innerHTML = '<div class="history-empty">Nothing logged yet — check off your first homework!</div>';
  }else{
    bankState.history.forEach(h=>{
      const li = document.createElement('li');
      const sign = h.delta > 0 ? '+' : '';
      li.innerHTML = '<span>'+h.text+'</span><span class="amt'+(h.delta<0?' neg':'')+'">'+(h.delta!==0?(sign+h.delta+' min · '):'')+h.ts+'</span>';
      list.appendChild(li);
    });
  }
}

async function init(){
  bankState = await loadBankState();
  viewWeekStart = clampToAnchor(realTodayWeekStart());
  weekData = await loadWeekData(viewWeekStart);
  pianoStatsCache = await loadAllWeeksPianoStats();

  document.getElementById('prevWeekBtn').addEventListener('click', ()=> goToWeek(addDaysStr(viewWeekStart, -7)));
  document.getElementById('nextWeekBtn').addEventListener('click', ()=> goToWeek(addDaysStr(viewWeekStart, 7)));
  document.getElementById('jumpBtn').addEventListener('click', ()=> goToWeek(realTodayWeekStart()));
  document.getElementById('parentBtn').addEventListener('click', toggleParentMode);
  document.getElementById('backupBtn').addEventListener('click', backupData);
  document.getElementById('restoreFileInput').addEventListener('change', (e)=>{
    handleRestoreFile(e.target.files[0]);
    e.target.value = '';
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  render();
}

init();
</script>
</body>
</html>
